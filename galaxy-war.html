<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نبرد کهکشانی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070a1f;--ink:#e9eeff;--cy:#4df3ff;--mg:#ff3d8b;--am:#ffc857;--dim:#8d97c9;--f:'Vazirmatn',Tahoma,system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas[data-s]{position:static !important;width:90px !important;height:90px !important;}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;pointer-events:none;font-weight:700;font-size:15px;text-shadow:0 0 12px #000}
#hud b{font-size:22px;font-weight:900;color:var(--cy);font-variant-numeric:tabular-nums;margin-inline-start:4px}
#hp{letter-spacing:3px;color:var(--mg);font-size:20px}
#banner{position:fixed;top:32%;left:0;right:0;text-align:center;font-size:44px;font-weight:900;color:var(--am);opacity:0;pointer-events:none;text-shadow:0 0 30px var(--am);transition:opacity .4s}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,rgba(16,22,63,.82),rgba(7,10,31,.95) 70%)}
#ov.h{display:none}
h1{margin:0;font-size:clamp(40px,10vw,76px);font-weight:900;line-height:1.1;background:linear-gradient(120deg,var(--cy),#9a7bff 55%,var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(77,243,255,.35))}
#ov p{margin:0;color:var(--dim);max-width:34ch;line-height:1.9;font-size:15px}
#ov .sc{font-size:20px;color:var(--ink)}
button{font:900 20px var(--f);color:#04121a;background:linear-gradient(120deg,var(--cy),#8cf7ff);border:0;border-radius:14px;padding:14px 44px;cursor:pointer;box-shadow:0 0 28px rgba(77,243,255,.45);transition:transform .15s}
button:hover{transform:scale(1.05)}button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--am);outline-offset:3px}
#ov{justify-content:flex-start;overflow:auto;touch-action:pan-y}
#scr{margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:760px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.b2{font-size:16px;padding:11px 24px;background:rgba(255,255,255,.08);color:var(--ink);box-shadow:none;border:1px solid rgba(255,255,255,.18)}
.b2.on{background:var(--cy);color:#04121a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.card button{font-size:15px;padding:9px 18px;box-shadow:none}
button:disabled{opacity:.4;cursor:default}
.card small{color:var(--dim);font-size:12px;line-height:1.6}
.card em{color:var(--am);font-style:normal;font-weight:700;font-size:14px;padding:9px 0}
.big{font-size:44px;height:90px;display:grid;place-items:center}
.lvs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(100%,420px)}
.lvb{font-size:22px;padding:16px 0}
.brand{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-size:14px;color:var(--dim);font-weight:bold;pointer-events:none;opacity:0.7;text-shadow:0 0 10px var(--cy);z-index:10}
.brand span{color:var(--cy)}
@media(max-width:520px){#hud b{font-size:16px}#hud{font-size:11px;padding:8px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
    <div>امتیاز<b id="sc">0</b></div>
    <div>🪙<b id="cn">0</b></div>
    <div>💎<b id="gm">0</b></div>
    <div>سطح<b id="lvl">1</b></div>
    <div id="hp"></div>
    <div>مرحله<b id="wv">1-1</b></div>
</div>
<div id="banner"></div>
<div class="brand">ساخته شده توسط <span>PC Zone</span></div>
<div id="ov"><div id="scr"></div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const $=id=>document.getElementById(id);
let currentCtx = g;
let W,H,D;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0)}
addEventListener('resize',rs);rs();
const R=(a,b)=>a+Math.random()*(b-a),PI2=Math.PI*2,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const TH=[['#5b3bd6','#d6307a','#1aa8c8'],['#1d6fd6','#17c6a0','#6b3bd6'],['#d65b1d','#d6307a','#7a3bd6'],['#17b84f','#1aa8c8','#3b5bd6'],['#c61717','#d6a01a','#5b1ad6']];
const MAXLV=20,HM=()=>[.7,1,1.4][S.dif]; // حالا ۲۰ مرحله
const SH=[
 {n:'شاهین',p:0,hp:5,sp:430,fr:1,c:['#2a4bd6','#4df3ff'],sc:1,d:'متعادل',price:'coin'},
 {n:'رعد',p:400,hp:4,sp:520,fr:.8,c:['#d6a02a','#ffe14d'],sc:.95,d:'تندتیر و چابک',price:'coin'},
 {n:'غول',p:900,hp:8,sp:360,fr:1.1,c:['#1fa862','#9dffc4'],sc:1.25,d:'زره سنگین',price:'coin'},
 {n:'شبح',p:1800,hp:6,sp:600,fr:.7,c:['#8a2ad6','#ff4dff'],sc:1,d:'سریع‌ترین',price:'coin'},
 {n:'الماس',p:10,hp:10,sp:550,fr:.5,c:['#00ffff','#ffffff'],sc:1.1,d:'افسانه‌ای!',price:'gem'}];
const WP=[
 {n:'پالس',p:0,cd:.17,i:'🔹',d:'با ⚡ تا سه‌تیر',price:'coin'},
 {n:'شات‌گان',p:350,cd:.4,i:'💥',d:'ساچمه‌های پخش‌شونده',price:'coin'},
 {n:'لیزر',p:700,cd:.07,i:'⚡',d:'پرسرعت و نفوذی',price:'coin'},
 {n:'موشک',p:1200,cd:.5,i:'🚀',d:'هدف‌یاب',price:'coin'},
 {n:'پلاسما',p:2200,cd:.45,i:'🌀',d:'موج بزرگ',price:'coin'},
 {n:'توفان',p:5,cd:.1,i:'🌪️',d:'سلاح الماسی',price:'gem'}];

let S={coins:0,gems:0,ships:[1,0,0,0,0],weps:[1,0,0,0,0,0],ship:0,wep:0,lv:1,best:0,snd:1,dif:1,shk:1,p_level:1,p_xp:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('gw3')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('gw3',JSON.stringify(S))}catch(e){}};

let st='menu',score=0,wave=0,lv=1,cur=S.lv,rc=0,rg=0,bonus=0,t=0,shake=0,P,E=[],B=[],EB=[],PT=[],UP=[],boss=null,q=0,sp=0,wt=0,paused=false,scrN='menu',tab='ship';
const stars=[...Array(110)].map(()=>({x:Math.random(),y:Math.random(),z:R(.2,1),p:R(0,6)}));

/* صدا */
let ac;
function snd(f,d,type='square',v=.04,k=.5){if(!S.snd)return;try{ac=ac||new AudioContext();const n=ac.currentTime,o=ac.createOscillator(),a=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*k),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a).connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}

/* اسپرایت درخشان */
const gl={};
function glow(c){if(gl[c])return gl[c];const s=document.createElement('canvas');s.width=s.height=64;const x=s.getContext('2d'),r=x.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'#fff');r.addColorStop(.25,c);r.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=r;x.fillRect(0,0,64,64);return gl[c]=s}
function lite(c,x,y,s,a=1,X=currentCtx){X.globalAlpha=a;X.drawImage(glow(c),x-s/2,y-s/2,s,s)}

/* ورودی */
const K={};let tg=null,touch=false;
addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key==='p'||e.key==='Escape')pause();if(e.key==='Enter'&&st==='menu'&&scrN==='menu')act('go',cur)});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
cv.addEventListener('pointermove',e=>{touch=e.pointerType==='touch';tg={x:e.clientX,y:e.clientY-(touch?70:0)}});
cv.addEventListener('pointerdown',e=>{touch=e.pointerType==='touch';tg={x:e.clientX,y:e.clientY-(touch?70:0)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play')pause(true)});
function pause(f){if(st!=='play')return;paused=f||!paused;banner(paused?'متوقف':'',paused?9e9:0)}

/* بازی */
function start(l){
  lv=l||cur;const s=SH[S.ship];
  const extraHp = Math.floor(S.p_level / 2);
  P={x:W/2,y:H*.82,r:15*Math.min(1,s.sc),hp:s.hp+extraHp,mx:s.hp+extraHp,w:1,sh:0,inv:0,cd:0,vx:0,sp:s.sp,lazer:0,speed:1};
  E=[];B=[];EB=[];PT=[];UP=[];score=0;rc=0;rg=0;wave=0;boss=null;paused=false;st='play';
  $('ov').classList.add('h');nextWave();
}
function nextWave(){
  wave++;wt=0;
  q = Math.floor(3 + wave*1.5 + lv*1.5); 
  sp=0;
  if(wave===5){q=Math.floor(q/2);const h=Math.round((60+lv*35)*HM());boss={x:W/2,y:-120,r:54,hp:h,max:h,cd:1.5,t:0,ang:0}}
  banner(wave===5?'تهدید بزرگ!':'مرحله '+lv+' · موج '+wave,1800);
}
let bt;function banner(s,ms){const b=$('banner');b.textContent=s;b.style.opacity=s?1:0;clearTimeout(bt);if(ms&&ms<9e8)bt=setTimeout(()=>b.style.opacity=0,ms)}
function spawn(){
  const r=Math.random();
  let ty=0;
  if(wave>=4 && r<0.15) ty=3;
  else if(wave>=3 && r<0.3) ty=2;
  else if(wave>=2 && r<0.55) ty=1;
  
  const hp=Math.max(1,Math.round(([1,4,2,3][ty]+Math.floor(lv/2)+Math.floor(wave/2))*HM()));
  const e={ty,x:R(40,W-40),y:-30,hp,max:hp,r:[15,22,17,14][ty],ph:R(0,6),cd:R(.8,2),sp:[90,55,70,120][ty]+lv*5+wave*3,v:[100,250,400,0][ty]+lv*10};
  e.bx=e.x;E.push(e);
}
function boom(x,y,c,n=22,s=1){for(let i=0;i<n;i++){const a=R(0,PI2),v=R(40,260)*s;PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(.4,.9),m:.9,c,s:R(10,26)*s})}}
function hit(){
  if(P.inv>0||P.sh>0)return;
  P.hp--;P.inv=1.6;P.w=Math.max(1,P.w-1);shake=14;boom(P.x,P.y,'#ff8a4d',30);snd(120,.4,'sawtooth',.07,.3);
  if(P.hp<=0)over();
}
function over(){
  st='over';boom(P.x,P.y,'#4df3ff',60,1.6);shake=26;
  S.coins+=rc;S.gems+=rg;S.best=Math.max(S.best,score);
  save();setTimeout(()=>screen('over'),900);
}
function stageClear(){
  st='clear';bonus=100+lv*50;rc+=bonus;S.coins+=rc;S.gems+=rg;S.best=Math.max(S.best,score);
  
  S.p_xp += 10 + lv*5;
  if(S.p_xp >= S.p_level * 20) { 
      S.p_level++; S.p_xp = 0; snd(800,.5,'sine',.1,2);
  }

  if(lv===S.lv&&lv<MAXLV)S.lv++;cur=Math.min(MAXLV,lv+1);save();
  setTimeout(()=>screen('clear'),500);
}
function fireP(){
  const w=P.w;P.cd=(P.lazer>0?0.05:WP[S.wep].cd*SH[S.ship].fr);snd(880,.07,'square',.02,.5);
  const add=(dx,a,o={})=>{const v=o.v||700;B.push(Object.assign({x:P.x+dx,y:P.y-18,vx:Math.sin(a)*v,vy:-Math.cos(a)*v,r:4,d:1,c:P.lazer>0?'#ff4dff':'#4df3ff',h:[]},o))};
  
  if (P.lazer > 0) {
    add(0,0,{v:1500, d:0.5, c:'#ff4dff'});
  } else if(S.wep===0){if(w===1)add(0,0);else if(w===2){add(-9,0);add(9,0)}else{add(0,0);add(-12,-.16);add(12,.16)}}
  else if(S.wep===1){const n=3+w*2;for(let i=0;i<n;i++)add((i-(n-1)/2)*4,(i-(n-1)/2)*.12,{d:.8,v:640,c:'#ffb04d',r:3.5})}
  else if(S.wep===2){add(0,0,{d:.6,v:1000,pi:2,r:3,c:'#9dff4d'});if(w>1){add(-11,0,{d:.6,v:1000,pi:2,r:3,c:'#9dff4d'});if(w>2)add(11,0,{d:.6,v:1000,pi:2,r:3,c:'#9dff4d'})}}
  else if(S.wep===3){const o={d:3,v:430,hm:1,ex:1,r:6,c:'#ff9d3d'};if(w===1)add(0,0,o);else{add(-12,-.2,o);add(12,.2,o);if(w>2)add(0,0,o)}}
  else if(S.wep===4){const o={d:2,v:520,pi:99,r:14,c:'#c07bff'};add(0,0,o);if(w>1)add(-18,-.12,o);if(w>2)add(18,.12,o)}
  else if(S.wep===5){ 
    add(0,0,{v:1200, d:1.5, c:'#ffffff', r:8});
    add(-15,-.1,{v:1100, d:1.2, c:'#00ffff', r:5});
    add(15,.1,{v:1100, d:1.2, c:'#00ffff', r:5});
  }
}
function near(b){let m=null,d=1e9;for(const e of boss?E.concat([boss]):E){if(e.hp<=0)continue;const k=dist(b,e);if(k<d){d=k;m=e}}return m}
function strike(b,tg){
  tg.hp-=b.d;b.h.push(tg);boom(b.x,b.y,b.c,3,.4);snd(300,.05,'triangle',.02);
  if(b.ex){boom(b.x,b.y,'#ff9d3d',16,.9);for(const e of E)if(e!==tg&&dist(b,e)<85)e.hp-=2}
  if(b.h.length>(b.pi||0))b.y=-99;
}
function kill(e){
  score+=[10,30,20,40][e.ty]*Math.ceil(lv/2);
  boom(e.x,e.y,['#ff3d8b','#ffb04d','#b57bff','#ff0000'][e.ty],e.ty?30:20);snd(200,.25,'sawtooth',.05,.3);shake=Math.max(shake,5);
  
  if(Math.random()<.6)UP.push({x:e.x,y:e.y,k:'c',v:2+lv+e.ty*3});
  else if(Math.random() < 0.05) UP.push({x:e.x, y:e.y, k:'gem', v: 1});
  else if(Math.random()<.2) {
    const types = ['w','s','h','lazer','bomb','shield','rage'];
    UP.push({x:e.x,y:e.y,k:types[Math.floor(Math.random()*types.length)]});
  }
}
function killBoss(){
  const b=boss;score+=500*lv;boom(b.x,b.y,'#ffc857',140,2.4);boom(b.x,b.y,'#ff3d8b',80,1.6);shake=30;snd(80,.9,'sawtooth',.08,.3);
  for(let i=0;i<10;i++)UP.push({x:b.x+R(-50,50),y:b.y+R(-20,20),k:'c',v:10+lv*3});
  UP.push({x:b.x,y:b.y,k:'h'},{x:b.x-30,y:b.y,k:'w'});
  UP.push({x:b.x+30, y:b.y, k:'gem', v:2});
  boss=null;
}

function update(dt){
  t+=dt;shake=Math.max(0,shake-dt*40);
  
  if(P.inv>0)P.inv-=dt;
  if(P.sh>0)P.sh-=dt;
  if(P.lazer>0)P.lazer-=dt;
  
  let mx=(K.arrowright||K.d?1:0)-(K.arrowleft||K.a?1:0),my=(K.arrowdown||K.s?1:0)-(K.arrowup||K.w?1:0);
  if(mx||my){P.x+=mx*P.sp*dt;P.y+=my*P.sp*dt;tg=null}
  else if(tg){const k=1-Math.pow(.0005,dt);P.vx=(tg.x-P.x)*k;P.x+=P.vx;P.y+=(tg.y-P.y)*k}
  P.x=Math.max(20,Math.min(W-20,P.x));P.y=Math.max(H*.3,Math.min(H-30,P.y));
  P.cd-=dt;
  if(P.cd<=0&&st==='play')fireP();
  
  if(q>0){sp-=dt;if(sp<=0){spawn();q--;sp=Math.max(.25,1.1-lv*.05-wave*.03)}}
  for(const e of E){
    e.cd-=dt;
    if(e.ty===0){e.y+=e.sp*dt;e.x=e.bx+Math.sin(t*2.2+e.ph)*55}
    else if(e.ty===1){e.y+=e.sp*dt;e.x=e.bx+Math.sin(t*.9+e.ph)*25}
    else if(e.ty===2){if(e.y<110)e.y+=e.sp*1.4*dt;else e.x=e.bx+Math.sin(t*1.2+e.ph)*90;e.y+=Math.sin(t+e.ph)*.3}
    else if(e.ty===3){
      const a=Math.atan2(P.y-e.y, P.x-e.x);
      e.x += Math.cos(a)*e.sp*dt;
      e.y += Math.sin(a)*e.sp*dt;
    }
    if((e.ty===1||e.ty===2)&&e.cd<=0&&e.y>0){e.cd=e.ty===2?1.5:2.4;const a=Math.atan2(P.y-e.y,P.x-e.x);EB.push({x:e.x,y:e.y,vx:Math.cos(a)*e.v,vy:Math.sin(a)*e.v,r:5,c:'#ff4d6d'})}
    if(dist(e,P)<e.r+P.r-3&&st==='play'){e.hp=0;hit()}
  }
  if(boss){const b=boss;b.t+=dt;if(b.y<120)b.y+=60*dt;else{b.x=W/2+Math.sin(b.t*.7)*(W*.32)}
    b.cd-=dt;if(b.cd<=0&&b.y>=100){b.cd=1.2;b.ang+=.35;
      const N=12+Math.min(lv,10);for(let i=0;i<N;i++){const a=b.ang+i*PI2/N;EB.push({x:b.x,y:b.y,vx:Math.cos(a)*200,vy:Math.sin(a)*200,r:5,c:'#ff9d3d'})}
      const a=Math.atan2(P.y-b.y,P.x-b.x);for(let i=-1;i<=1;i++)EB.push({x:b.x,y:b.y,vx:Math.cos(a+i*.18)*320,vy:Math.sin(a+i*.18)*320,r:5,c:'#ff4d6d'});snd(150,.2,'sawtooth',.04,.5)}
    if(dist(b,P)<b.r+P.r&&st==='play')hit();
  }
  for(const b of B){
    if(b.hm){const T=near(b);if(T){const a=Math.atan2(T.y-b.y,T.x-b.x),v=Math.hypot(b.vx,b.vy),k=Math.min(1,dt*7);b.vx+=(Math.cos(a)*v-b.vx)*k;b.vy+=(Math.sin(a)*v-b.vy)*k}}
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    for(const e of E)if(e.hp>0&&b.y>-90&&!b.h.includes(e)&&dist(b,e)<e.r+b.r)strike(b,e);
    if(boss&&b.y>-90&&!b.h.includes(boss)&&dist(b,boss)<boss.r+b.r)strike(b,boss);
  }
  for(const b of EB){b.x+=b.vx*dt;b.y+=b.vy*dt;if(st==='play'&&dist(b,P)<b.r+P.r-4){b.y=H+99;hit()}}
  
  for(const u of UP){
    if((u.k==='c' || u.k==='gem') && dist(u,P)<150){const a=Math.atan2(P.y-u.y,P.x-u.x);u.x+=Math.cos(a)*420*dt;u.y+=Math.sin(a)*420*dt}else u.y+=70*dt;
    if(st==='play'&&dist(u,P)<28){u.y=H+99;
      if(u.k==='c'){rc+=u.v;snd(1200,.08,'sine',.03,1.5)}
      else if(u.k==='gem'){rg+=u.v;snd(1600,.15,'sine',.05,2)}
      else{
        snd(660,.2,'sine',.05,2);
        if(u.k==='w')P.w=Math.min(3,P.w+1);
        else if(u.k==='s')P.sh=7;
        else if(u.k==='h')P.hp=Math.min(P.mx,P.hp+1);
        else if(u.k==='lazer')P.lazer=5;
        else if(u.k==='shield')P.sh=10;
        else if(u.k==='bomb'){
          shake=20; boom(W/2, H/2, '#ff0000', 100, 2);
          for(const e of E) e.hp=0;
          if(boss) boss.hp -= 50;
        } else if (u.k === 'rage') {
          P.lazer = 5; P.sh = 5; P.sp = 600;
          setTimeout(() => P.sp = SH[S.ship].sp, 5000);
        }
        boom(P.x,P.y,'#ffc857',14,.6);
      }
    }
  }
  
  for(const p of PT){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.l-=dt}
  for(const e of E)if(e.hp<=0&&!e.dead){e.dead=1;kill(e)}
  if(boss&&boss.hp<=0)killBoss();
  B=B.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20);
  EB=EB.filter(b=>b.y<H+30&&b.y>-30&&b.x>-30&&b.x<W+30);
  E=E.filter(e=>e.hp>0&&e.y<H+40);UP=UP.filter(u=>u.y<H+30);PT=PT.filter(p=>p.l>0);
  
  if(st==='play'&&q===0&&!E.length&&!boss){wt+=dt;if(wt>1.8)wave>=5?stageClear():nextWave()}
  
  $('sc').textContent=score;
  $('cn').textContent=S.coins+rc;
  $('gm').textContent=S.gems+rg;
  $('lvl').textContent=S.p_level;
  $('wv').textContent=lv+'-'+wave;
  $('hp').textContent='♥'.repeat(Math.max(0,P.hp));
}

function bg(dt){
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#050716');gr.addColorStop(1,'#10113a');g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';
  const c3=TH[(lv-1)%TH.length];lite(c3[0],W*.25+Math.sin(t*.1)*60,H*.3,W*1.1,.28);lite(c3[1],W*.8+Math.cos(t*.13)*50,H*.65,W*.9,.2);lite(c3[2],W*.5,H*.95,W*.8,.16);
  for(const s of stars){s.y+=s.z*(st==='play'?150:50)*dt/H;if(s.y>1){s.y=0;s.x=Math.random()}
    lite('#cfe3ff',s.x*W,s.y*H,2+s.z*5,.35+.45*Math.abs(Math.sin(t*1.5+s.p))*s.z)}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
}
function drawS(X,s,f){
  const oldCtx = currentCtx;
  currentCtx = X;
  X.save();
  X.scale(s.sc,s.sc);
  X.globalCompositeOperation='lighter';
  lite(s.c[1],0,22,64+f*2,.9,X);
  lite('#ffffff',0,18,24+f*.4,1,X);
  X.globalAlpha=1;
  X.globalCompositeOperation='source-over';
  const gr=X.createLinearGradient(-20,0,20,0);
  gr.addColorStop(0,s.c[0]);
  gr.addColorStop(.5,'#cfe8ff');
  gr.addColorStop(1,s.c[0]);
  X.fillStyle=gr;
  X.beginPath();
  X.moveTo(0,-26);X.lineTo(9,-4);X.lineTo(26,16);X.lineTo(26,22);X.lineTo(10,15);X.lineTo(5,22);X.lineTo(-5,22);X.lineTo(-10,15);X.lineTo(-26,22);X.lineTo(-26,16);X.lineTo(-9,-4);
  X.closePath();X.fill();
  X.strokeStyle=s.c[1];X.lineWidth=1.5;X.stroke();
  X.fillStyle='#ff3d8b';X.beginPath();X.ellipse(0,-6,3.5,8,0,0,PI2);X.fill();
  X.restore();
  currentCtx = oldCtx;
}
function ship(){
  if(P.inv>0&&Math.floor(t*14)%2)return;
  g.save();g.translate(P.x,P.y);g.rotate(Math.max(-.35,Math.min(.35,P.vx*.03)));
  drawS(g,SH[S.ship],Math.sin(t*60)*5);g.restore();
  if(P.sh>0){g.save();g.globalCompositeOperation='lighter';g.strokeStyle='#4df3ff';g.globalAlpha=.5+.3*Math.sin(t*12)*(P.sh<2?1:.2);g.lineWidth=3;g.beginPath();g.arc(P.x,P.y,32,0,PI2);g.stroke();lite('#4df3ff',P.x,P.y,90,.25);g.restore()}
}
function enemy(e){
  g.save();g.translate(e.x,e.y);
  const col=['#ff3d8b','#ffb04d','#b57bff','#ff0000'][e.ty];
  g.globalCompositeOperation='lighter';lite(col,0,0,e.r*3.2,.55);g.globalCompositeOperation='source-over';g.globalAlpha=1;
  const gr=g.createRadialGradient(0,-4,2,0,0,e.r);gr.addColorStop(0,'#fff');gr.addColorStop(.35,col);gr.addColorStop(1,'#1b1040');
  g.fillStyle=gr;g.strokeStyle=col;g.lineWidth=2;g.beginPath();
  if(e.ty===0){g.moveTo(0,e.r);g.lineTo(-e.r,-4);g.lineTo(-e.r*.5,-e.r);g.lineTo(e.r*.5,-e.r);g.lineTo(e.r,-4)}
  else if(e.ty===1){for(let i=0;i<6;i++){const a=i*PI2/6+Math.PI/6;g.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r)}}
  else if(e.ty===2){g.moveTo(0,e.r);g.lineTo(-e.r,-e.r*.2);g.lineTo(-e.r*.4,-e.r);g.lineTo(e.r*.4,-e.r);g.lineTo(e.r,-e.r*.2)}
  else {g.moveTo(0,e.r);g.lineTo(-e.r,-e.r);g.lineTo(e.r,-e.r)}
  g.closePath();g.fill();g.stroke();
  if(e.max>1){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(-e.r,e.r+6,e.r*2,3);g.fillStyle=col;g.fillRect(-e.r,e.r+6,e.r*2*e.hp/e.max,3)}
  g.restore();
}
function drawBoss(){
  const b=boss;g.save();g.translate(b.x,b.y);
  g.globalCompositeOperation='lighter';lite('#ff3d8b',0,0,b.r*4,.5);lite('#ffc857',0,0,b.r*2,.4+.2*Math.sin(t*6));g.globalCompositeOperation='source-over';g.globalAlpha=1;
  g.rotate(Math.sin(t)*.05);
  const gr=g.createLinearGradient(0,-b.r,0,b.r);gr.addColorStop(0,'#5a2a8a');gr.addColorStop(1,'#1a0d2e');g.fillStyle=gr;g.strokeStyle='#ff9d3d';g.lineWidth=3;
  g.beginPath();g.moveTo(0,b.r);g.lineTo(-b.r*1.5,-b.r*.1);g.lineTo(-b.r*.8,-b.r*.8);g.lineTo(-b.r*.3,-b.r*.5);g.lineTo(b.r*.3,-b.r*.5);g.lineTo(b.r*.8,-b.r*.8);g.lineTo(b.r*1.5,-b.r*.1);g.closePath();g.fill();g.stroke();
  g.fillStyle='#ffc857';g.beginPath();g.arc(0,0,13+Math.sin(t*8)*2,0,PI2);g.fill();
  g.restore();
  const w=Math.min(300,W*.6);g.fillStyle='rgba(0,0,0,.55)';g.fillRect(W/2-w/2,64,w,8);g.fillStyle='#ff3d8b';g.fillRect(W/2-w/2,64,w*b.hp/b.max,8);
}
function draw(dt){
  g.save();if(shake>0&&S.shk)g.translate(R(-shake,shake)*.5,R(-shake,shake)*.5);
  bg(dt);
  for(const u of UP){const c={w:'#ffc857',s:'#4df3ff',h:'#ff3d8b',c:'#ffd23d',lazer:'#ff4dff',bomb:'#ff0000',shield:'#4df3ff',rage:'#ff4dff',gem:'#00ffff'}[u.k];g.globalCompositeOperation='lighter';lite(c,u.x,u.y,46+Math.sin(t*8)*6,.9);g.globalCompositeOperation='source-over';g.globalAlpha=1;
    g.fillStyle='#fff';g.font='900 15px Vazirmatn,sans-serif';g.textAlign='center';g.fillText({w:'⚡',s:'◎',h:'♥',c:'¢',lazer:'L',bomb:'B',shield:'O',rage:'★',gem:'💎'}[u.k],u.x,u.y+5)}
  for(const e of E)enemy(e);if(boss)drawBoss();
  g.globalCompositeOperation='lighter';
  for(const b of EB){lite(b.c,b.x,b.y,22,.95);lite('#fff',b.x,b.y,8,1)}
  for(const b of B){lite(P.lazer>0?'#ff4dff':'#4df3ff',b.x,b.y,30,.9);lite('#fff',b.x,b.y,10,1)}
  for(const p of PT)lite(p.c,p.x,p.y,p.s*(p.l/p.m),Math.min(1,p.l*1.6));
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  if(st==='play'||P&&P.hp>0&&st!=='menu')ship();
  g.restore();
}

let last=performance.now();
function loop(n){
  const dt=Math.min(.033,(n-last)/1000);last=n;
  if(st==='menu'){t+=dt;bg(dt);P={x:W/2+Math.sin(t)*70,y:H*.82,vx:Math.cos(t)*2,inv:0,sh:0,lazer:0};ship()}
  else{if(!paused)update(dt);else t+=0;draw(paused?0:dt)}
  requestAnimationFrame(loop);
}
const ov=$('ov'),scr=$('scr');
const btn=(a,v,l,x='')=>`<button data-a="${a}" data-v="${v}" ${x}>${l}</button>`;
function screen(n){
  scrN=n;ov.classList.remove('h');let h='';
  if(n==='menu')h=`<h1>نبرد کهکشانی</h1><p class="sc">🪙 ${S.coins} · 💎 ${S.gems} · رکورد ${S.best}</p><p>سطح شما: ${S.p_level} (XP: ${S.p_xp}/${S.p_level*20})</p>${btn('go',cur,'شروع مرحله '+cur)}
    <div class="row">${btn('scr','lv','مراحل','class="b2"')}${btn('scr','shop','فروشگاه','class="b2"')}${btn('scr','set','تنظیمات','class="b2"')}</div>`;
  else if(n==='lv'){h=`<h1>مراحل</h1><p>هر مرحله ۵ موج دارد و آخرش یک باس.</p><div class="lvs">`;
    for(let i=1;i<=MAXLV;i++)h+=btn('go',i,i>S.lv?'🔒':i,`class="lvb ${i===cur?'':'b2'}" ${i>S.lv?'disabled':''}`);
    h+=`</div>${btn('scr','menu','بازگشت','class="b2"')}`}
  else if(n==='shop'){
    h=`<h1>فروشگاه</h1><p class="sc">🪙 ${S.coins} · 💎 ${S.gems}</p><div class="row">${btn('tab','ship','ناوها','class="b2 '+(tab==='ship'?'on':'')+'"')}${btn('tab','wep','سلاح‌ها','class="b2 '+(tab==='wep'?'on':'')+'"')}</div><div class="grid">`;
    const ship=tab==='ship',L=ship?SH:WP,O=ship?S.ships:S.weps,cu=ship?S.ship:S.wep;
    L.forEach((x,i)=>{
      let priceText = x.price === 'gem' ? '💎 ' + x.p : '🪙 ' + x.p;
      let canAfford = x.price === 'gem' ? S.gems >= x.p : S.coins >= x.p;
      
      h+=`<div class="card">${ship?`<canvas width="90" height="90" data-s="${i}"></canvas>`:`<div class="big">${x.i}</div>`}<b>${x.n}</b><small>${x.d}${ship?`<br>جان ${x.hp} · سرعت ${x.sp}`:''}</small>`+
      (O[i]?(cu===i?'<em>انتخاب‌شده</em>':btn('eq',(ship?'ship:':'wep:')+i,'انتخاب')):btn('buy',(ship?'ship:':'wep:')+i,priceText,canAfford?'':'disabled'))+`</div>`
    });
    h+=`</div>${btn('scr','menu','بازگشت','class="b2"')}`}
  else if(n==='set'){const o=(v)=>v?'روشن':'خاموش';
    h=`<h1>تنظیمات</h1><div class="row">${btn('snd',0,'صدا: '+o(S.snd),'class="b2 on"')}${btn('shk',0,'لرزش صفحه: '+o(S.shk),'class="b2 on"')}</div>
    <p>درجه سختی</p><div class="row">${['آسان','متوسط','سخت'].map((l,i)=>btn('dif',i,l,'class="b2 '+(S.dif===i?'on':'')+'"')).join('')}</div>${btn('scr','menu','بازگشت','class="b2"')}`}
  else if(n==='over')h=`<h1>ناو منهدم شد</h1><p class="sc">مرحله ${lv}-${wave} · امتیاز ${score}<br>🪙 ${rc} سکه · 💎 ${rg} الماس</p>${btn('go',lv,'تلاش دوباره')}<div class="row">${btn('scr','shop','فروشگاه','class="b2"')}${btn('scr','menu','منو','class="b2"')}</div>`;
  else if(n==='clear')h=`<h1>مرحله ${lv} کامل شد!</h1><p class="sc">امتیاز ${score}<br>🪙 ${rc} سکه (شامل ${bonus} جایزه)<br>💎 ${rg} الماس</p>${lv<MAXLV?btn('go',cur,'مرحله '+cur):'<p class="sc">همه‌ی مرحله‌ها رو تمام کردی، قهرمان!</p>'}<div class="row">${btn('scr','shop','فروشگاه','class="b2"')}${btn('scr','menu','منو','class="b2"')}</div>`;
  scr.innerHTML=h;
  scr.querySelectorAll('canvas[data-s]').forEach(c=>{
      const x = c.getContext('2d');
      x.clearRect(0, 0, c.width, c.height);
      x.save();
      x.translate(45, 50);
      x.scale(1.15, 1.15);
      drawS(x, SH[+c.dataset.s], 4);
      x.restore();
  });
}
function act(a,v){
  if(a==='go'){cur=+v;start(cur)}
  else if(a==='scr'){st='menu';screen(v)}
  else if(a==='tab'){tab=v;screen('shop')}
  else if(a==='buy'||a==='eq'){
    const [k,i]=v.split(':'),I=+i,L=k==='ship'?SH:WP,O=k==='ship'?S.ships:S.weps;
    if(a==='buy' && !O[I]){
      let canAfford = L[I].price==='gem' ? S.gems >= L[I].p : S.coins >= L[I].p;
      if(canAfford){
        if(L[I].price==='gem') S.gems -= L[I].p;
        else S.coins -= L[I].p;
        O[I]=1; snd(900,.2,'sine',.05,2);
      }
    }
    if(O[I])S[k==='ship'?'ship':'wep']=I;
    save();screen('shop')}
  else if(a==='dif'){S.dif=+v;save();screen('set')}
  else if(a==='snd'||a==='shk'){S[a]^=1;save();screen('set')}
}
ov.onclick=e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset.v)};
screen('menu');
requestAnimationFrame(loop);
</script>
</body>
</html>
